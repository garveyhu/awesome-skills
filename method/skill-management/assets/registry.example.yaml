# registry.yaml —— skill 管理单一事实源（放在 <root>/registry.yaml）
# 改完此表跑： python3 scripts/skillctl.py sync   再 doctor 验收
#
# 物理结构：<root>/<source>/<category>/<skill>/SKILL.md

# 1) 挂载点：把 core+extra 软链进每个 agent 的 skill 目录（按你用的 agent 填）
mounts:
  - ~/.claude/skills           # Claude Code：原生 skill 自动发现
  # - ~/.codex/skills          # Codex：无原生 skill 目录，软链进你在 AGENTS.md 里引用的目录
  # - ~/some-other-agent/skills

# 2) 来源：顶层目录，按「谁创建的」分。含 .git 的来源 = 会 push 的仓库
sources:
  mine:      "我自己的 skill · git 仓库，会 push"
  community: "开源 / 第三方来源 · 本地编排，不进我的仓库"
  # company: "公司内部 skill · 加一行 + 建 company/ 目录即可扩展"

# 2.5) 项目（可选）：tier:project 的 skill 归属哪个工作目录。每行 <项目名>: "<目录绝对路径>"，支持非 git 目录。
#      这类 skill 默认移出全局（不进镜像 / 不进 mounts）、只声明不挂载；`skillctl mount <项目名>` 才把它们
#      软链进 <目录>/.claude/skills/。注：Claude 从 git 根读 project skill，要 Claude 自动加载就把路径指向 git 根。
projects:
  my-side-project: "/abs/path/to/my-side-project"   # 例：某专属工作目录（只此目录才用的 skill 归这里）

# 3) 分类：来源内的场景分组（同一分类可横跨多个来源）。分类可多级，用 / 分隔，据 SKILL.md 递归识别
categories:
  method: "研发方法论 · 计划/TDD/调试/评审"
  stack:  "技术栈实践 · 各框架最佳实践"
  docs:   "写作与文档"
  # 伞型分类可再分子类（任意深度）：
  media/image: "出图"
  media/audio: "配音/音频"
  media/video: "视频"

# 4) skill：每条登记 source / category / tier
#    tier: core=进扁平镜像+挂载 / extra=只挂载(按需) / project=移出全局,归某项目(默认仅声明,见 projects:) / parked=仅留存不装载
skills:
  # ---- mine（我自己的） ----
  skill-management:        {source: mine, category: method, tier: core}
  my-react-conventions:    {source: mine, category: stack,  tier: core}
  my-image-pipeline:       {source: mine, category: media/image, tier: extra}  # 多级分类示例
  my-side-project-tool:    {source: mine, category: stack,  tier: project, project: my-side-project}  # 只在该项目用、不进全局

  # ---- community（第三方） ----
  brainstorming:           {source: community, category: method, tier: core}   # obra/superpowers
  some-heavy-skill:        {source: community, category: media/video, tier: parked} # 留存但不装载
