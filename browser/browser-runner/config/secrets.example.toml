# browser-runner 密钥模板。
# 用法：复制到 ~/.browser-runner/secrets.toml，填你自己的 key。
# 这个文件只放在 ~/.browser-runner/ 里，不进任何 git，skill 目录本身一个密钥都不写。
#
# 对应关系：流程 flow.toml 里写 needs = ["llm.deepseek"]，
# 就是要用下面 [llm.deepseek] 这一段。段名随你加（llm.qwen、platform.bilibili …）。

# 大模型（OpenAI 兼容接口都行：deepseek / qwen / 自建网关 …）
# [llm.deepseek]
# api_key  = "sk-你的key"
# base_url = "https://api.deepseek.com"
# model    = "deepseek-chat"

# [llm.qwen]
# api_key  = "你的key"
# base_url = "https://dashscope.aliyun.com/compatible-mode/v1"
# model    = "qwen-plus"

# 平台 token 之类也照这个格式加，流程里 ctx.secret("platform.xxx") 取用：
# [platform.example]
# token = "..."
