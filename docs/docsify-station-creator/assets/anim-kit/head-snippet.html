<!-- ============================================================
     动画模式：把下面两段加进站点 index.html
     （标准模式不要加这些）
     ============================================================ -->

<!-- ① 加在 <head> 里（紧跟 vue.css 之后，让 anim.css 能覆盖）-->
<link rel="stylesheet" href="assets/anim-kit/anim.css" />


<!-- ② 加在 </body> 之前：动画引擎库 + 框架 + 各动画 + 挂载钩子 -->

<!-- 动画引擎库：GSAP 必需，从自托管 CDN 引（勿引第三方 CDN）。
     若新动画用到 D3 / anime，先把库放进 cdn 仓库 `libs/` 再引，同样不引第三方 CDN。 -->
<script src="https://cdn.archeruuu.com/libs/gsap/gsap.min.js"></script>
<script src="https://cdn.archeruuu.com/libs/gsap/ScrollTrigger.min.js"></script>
<script>if (window.gsap && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);</script>

<!-- 动画框架 -->
<script src="assets/anim-kit/anim-core.js"></script>

<!-- 各动画模块：每用到一个就加一行（只加站点里实际 data-anim 引用到的） -->
<script src="assets/anim/request-lifecycle.js"></script>
<!-- <script src="assets/anim/dag-execution.js"></script> -->
<!-- <script src="assets/anim/<你新写的>.js"></script> -->

<!-- 挂载钩子：把动画挂进 docsify 每次渲染后的页面 -->
<script>
  (function () {
    if (!window.$docsify) return;
    window.$docsify.plugins = [].concat(window.$docsify.plugins || [], function (hook) {
      hook.doneEach(function () {
        if (window.AnimCore) window.AnimCore.mountAll();
      });
    });
  })();
</script>
